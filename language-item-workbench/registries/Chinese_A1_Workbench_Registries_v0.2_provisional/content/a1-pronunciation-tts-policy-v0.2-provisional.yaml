policyId: A1-PRON-TTS-v0.2-provisional
status: ProvisionalExploratory
inputVariety: clearNaturalStandardMandarin
rules:
- Read core lexical items using their level-specific meanings and pronunciations; manually confirm polyphonic characters in context.
- Use tone marks for pinyin pronunciation support; realise neutral tones in natural Standard Mandarin.
- Realise common tone sandhi, including 一, 不, and consecutive third tones, in natural connected speech; retain dictionary forms and actual audio QA results in the Registry.
- Use erhua naturally only in fixed word forms; do not make regional erhua a prerequisite for comprehension.
- Read years, phone numbers, room numbers, and route numbers as they would appear on authentic signs; keep prices, dates, and times consistent across comparable tasks.
- Human reviewers must listen to person names, place names, loanwords, number-dense segments, and words that TTS commonly mispronounces.
- Audio must match the approved authoringTranscript word for word and must not signal the answer through stress, pauses, or intonation.
- Keep voice, volume, and baseline speaking-rate conditions comparable for the same role, parallel tasks, and turns within one task.
qaFields:
- scriptMatch
- segmentalAccuracy
- toneAndSandhi
- neutralTone
- properNames
- numbersAndTimes
- pauses
- rate
- volume
- artifacts
- fairness
operationalParametersStatus: PendingVoiceSelectionAndPilot
