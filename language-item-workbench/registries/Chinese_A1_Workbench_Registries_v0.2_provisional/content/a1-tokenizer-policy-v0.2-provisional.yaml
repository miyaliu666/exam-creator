policyId: A1-ZH-TOKENIZER-v0.2-provisional
status: ProvisionalExploratory
script: zh-Hans
rules:
- Use longest-match-first against the approved lexicon: identify fixed expressions before shorter entries.
- Do not count the same character span as both a longer word and an internal shorter word unless a reviewer explicitly requires overlapping annotation.
- Record token positions separately for the stimulus, prompt, options, and expected response concepts.
- Segment punctuation, numbers, Latin letters, and supported proper names separately; do not automatically treat them as core vocabulary.
- Create a reviewFinding for unmatched spans instead of adding them automatically to the core scope.
- Automated matching is only a first pass; polysemy, word boundaries, names, and grammatical function words require human confirmation.
- visibleCharacterIds records every Chinese character shown in the item; requiredCharacterIds records only characters that must be recognised to complete the task without support.
- Do not use simplified/traditional conversion to mark candidate responses correct automatically; retain the original text.
algorithm: approved-longest-match-with-offsets
humanConfirmationRequired: true
