policyId: A1-ZH-TOKENIZER-v0.2-provisional
status: ProvisionalExploratory
script: zh-Hans
rules:
- 对批准词表采用最长匹配优先，先识别固定表达，再识别较短词项。
- 同一字符区间不得同时重复计入一个长词和其内部短词，除非人工明确要求交叉标记。
- 分别记录 stimulus、prompt、options 和 expected response concepts 的词项位置。
- 标点、数字、拉丁字母和支持性专名单独分段，不自动视为核心词汇。
- 未匹配片段生成 reviewFinding，而不是自动加入核心范围。
- 自动匹配只做初筛；多义词、词边界、姓名和语法功能词必须人工确认。
- visibleCharacterIds 记录题面全部汉字；requiredCharacterIds 只记录无支持条件下完成任务必须认读的字。
- 简繁转换不得用于自动把考生答案判对，原始文本必须保留。
algorithm: approved-longest-match-with-offsets
humanConfirmationRequired: true
