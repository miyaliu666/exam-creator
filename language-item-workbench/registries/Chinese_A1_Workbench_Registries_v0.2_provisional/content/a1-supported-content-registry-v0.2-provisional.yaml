registryType: A1SupportedContentRegistry
registryVersion: 0.2-provisional
entries:
- supportedContentTypeId: SUP-PERSON-NAME
  type: personName
  allowedSupport:
  - pinyin
  - sourceVisible
  - audio
  rule: Person names outside the core scope may receive consistent pinyin support on first occurrence or remain visible in the source material; they must not be the sole target words.
- supportedContentTypeId: SUP-PLACE-NAME
  type: placeName
  allowedSupport:
  - pinyin
  - mapLabel
  - sourceVisible
  rule: Place names may only establish context; location tasks must still be completed using core location language.
- supportedContentTypeId: SUP-INSTITUTION-NAME
  type: institutionName
  allowedSupport:
  - pinyin
  - shortGloss
  - sourceVisible
  rule: Institution names must not require prior knowledge or depend on institutional knowledge.
- supportedContentTypeId: SUP-COURSE-NAME
  type: courseName
  allowedSupport:
  - pinyin
  - sourceVisible
  rule: Course names may be copied or relayed, but they must not be the sole scored evidence of reading or writing ability.
- supportedContentTypeId: SUP-ACTIVITY-NAME
  type: activityName
  allowedSupport:
  - pinyin
  - image
  - sourceVisible
  rule: Activity names must be specific, adult-appropriate, and independent of cultural background knowledge.
- supportedContentTypeId: SUP-LOW-FREQUENCY-ITEM
  type: lowFrequencyItem
  allowedSupport:
  - image
  - shortGloss
  - sourceVisible
  rule: Use only when genuinely necessary for an authentic context; the item must still contain scored evidence of core language.
- supportedContentTypeId: SUP-FOOD-NAME
  type: foodName
  allowedSupport:
  - image
  - shortGloss
  - sourceVisible
  rule: Region-specific foods may appear on a menu, but global A1 candidates must not be expected to know them in advance.
- supportedContentTypeId: SUP-ADDRESS-SEGMENT
  type: addressSegment
  allowedSupport:
  - sourceVisible
  - structuredField
  rule: Use only the short address segment needed for locating or copying; do not require complex address knowledge.
- supportedContentTypeId: SUP-ROUTE-LABEL
  type: routeOrServiceLabel
  allowedSupport:
  - sourceVisible
  - iconWithText
  rule: Route, service number, counter, and service labels must be clear; number formatting must not create traps.
- supportedContentTypeId: SUP-LATIN-PROPER-NAME
  type: latinProperName
  allowedSupport:
  - sourceVisible
  - audio
  rule: Approved Latin-script proper names may remain unchanged; letter case must not be treated as a core language difficulty.
- supportedContentTypeId: SUP-INTERFACE-LABEL
  type: interfaceLabel
  allowedSupport:
  - interfaceLanguage
  - iconWithText
  rule: Control labels are interface language and must not count toward target-language ability.
- supportedContentTypeId: SUP-CULTURE-SPECIFIC
  type: cultureSpecificContent
  allowedSupport:
  - shortGloss
  - image
  - sourceVisible
  rule: Avoid by default; when genuinely necessary, provide an explanation and do not make it the basis of the answer.
