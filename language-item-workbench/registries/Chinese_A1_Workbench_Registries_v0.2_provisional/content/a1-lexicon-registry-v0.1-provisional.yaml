humanReviewRequired:
- 逐条确认是否直接支持至少一个项目 Can-do，而不是只因出现在 HSK 清单中保留
- 逐条确认 receptive 与 receptiveProductive 范围
- 逐条确认义项、搭配、语域、礼貌和地区限制
- 逐条核对拼音、轻声、变调、多音字和 TTS 读音
- 复核 canDoIds 与 contextIds；当前为首轮功能映射，不是最终专家批准结果
- 完成 GF0025-2021 和 TOCFL 初级逐项对照
- 通过一组代表性样题验证本清单能否支持 15 个 Blueprint Slot
