registryType: A1CoreLexiconAndFixedExpressions
registryVersion: a1-lexicon-0.1-provisional
status: ProvisionalExploratory
purpose: 供命题工作台开发、探索性样题命制和人工内容审核使用。
allowedUse:
- workbenchDevelopment
- exploratoryItemAuthoring
- humanContentReview
prohibitedUse:
- formalPilotBatchGeneration
- operationalExam
controllingProjectBasis:
  certificationScope: 全球成年非母语学习者的在线固定等级通用汉语 A1 考试
  canDoSource: 项目第 2 章正式 Can-do Statements
  contextSource: 项目第 2 章 D01–D20 成人使用情境
  externalLevelEquivalenceAssumed: false
selectionPolicy:
  primaryCandidatePool: HSK 3.0 2025-11 考试大纲一级词汇、任务、话题与语法
  currentStatusNote: 截至 2026-09-03，HSK 3.0 仍处全球试行阶段；其一级清单作为最新候选内容库，而非本项目 A1 的现成标准。
  legacyConservativeCheck: HSK 2.0 旧版一级 150 词与公开语言功能
  topLevelCrossCheck: GF0025-2021《国际中文教育中文水平等级标准》
  decisionMethod:
  - retain
  - adjust
  - deleteOrSupport
  - supplement
  forbiddenShortcuts:
  - 不得直接复制旧版 150 词
  - 不得直接复制新版 300 词
  - 不得机械取两份清单的交集或并集
  - 不得先规定词数再反推能力
countingPolicy:
  recordUnit: 一个受限义项的词语、固定表达或与附录 C 交叉登记的高频语法功能词
  homographs: 同形但不同读音或不在 A1 范围内的义项不自动纳入
  variants: acceptedVariants 不另计；relatedForms 若有独立记录则分别计数
  comparisonWarning: 本表包含固定表达和语法功能词，数量不能直接与 HSK 的词条数比较。
masteryScopeDefinitions:
  receptive: 可以在适合的输入材料中不加解释地要求理解，但不得要求考生独立回忆并产出该词。
  receptiveProductive: 可以在输入中要求理解，且任务可以要求考生表达该概念；开放回答仍不得把某一固定词形设为唯一正确表达。
recordTypeDefinitions:
  word: 内容词或普通词语
  fixedExpression: 作为整体管理的高频固定表达
  grammaticalWord: 与附录 C 的具体构式交叉登记的高频功能词、助词、后缀或构式标记
