taskSpecificCriteria:
- requirements:
  - 4-6 fields
  - at least one Chinese field
  - field labels understood
  - no real sensitive information
  capOrExclusion: All-mechanical copying cannot alone satisfy the task.
  itemRuleIds:
  - legacy-rule-5e505212f0bb4843b429f3167cf0c85cb8d393973990e523b9bf23af58339bf4
- requirements:
  - respond to source message
  - ask, state or confirm at least one arrangement detail
  - 1-3 content points
  capOrExclusion: Without actual message response or arrangement behavior, Task
    Fulfilment cannot exceed band 1 and A1-I3b is not evidenced.
  itemRuleIds:
  - legacy-rule-24afd085454c01024191fa5f08c830907a891f28f2286948b7490968e97c4310
- requirements:
  - select relevant information
  - maintain key information accuracy
  - address specified recipient and purpose
  capOrExclusion: Pure copying without recipient-oriented message caps Task
    Fulfilment at band 1.
  itemRuleIds:
  - legacy-rule-a8b19cb94037155dc6a1c8975e33e04af5ab76c6b98206770353425894b13144
- requirements:
  - answer personal/familiar questions
  - provide basic information
  - ask one related question
  capOrExclusion: No required initiation caps Interaction and Responsiveness at band 1.
  itemRuleIds:
  - legacy-rule-e3351cc6d0277220ab52e838a632ab203b600496d4e3f2d4e41c0c4ed341166e
- requirements:
  - address 1-3 prompted content points
  - remain intelligible enough to identify key content
  capOrExclusion: Reading a supplied sentence does not count as the target production.
  itemRuleIds:
  - legacy-rule-18b146fee99ec17e7a1024be0628829b4e5b604b7a1dd728a9725906d73e2e32
- requirements:
  - respond across 2-3 turns
  - complete required request/confirmation/repair
  - actually speak
  capOrExclusion: Selecting an option without speaking yields no Interaction evidence.
  itemRuleIds:
  - legacy-rule-3cdb3f05762f5de91d1cc2ca529900528b6312f29470b150dd63dc631dda6b17
- requirements:
  - select recipient-relevant information
  - relay key details accurately
  - complete oral relay purpose
  capOrExclusion: Reading the whole source without recipient-oriented relay caps
    task fulfilment at band 1.
  itemRuleIds:
  - legacy-rule-8a543f21723a84bc5b9f181b4961ae2cd1c6f908a0371f6997ebf1b733fb366b
