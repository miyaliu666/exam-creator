registryType: A1ScoringRegistry
registryVersion: 0.3-provisional
normalizationRules:
- normalizationRuleId: NORM-NONE-v0.1
  scope: selection and matching IDs
  allowedProcessing:
  - validate submitted IDs
  prohibitedProcessing:
  - semantic guessing
- normalizationRuleId: NORM-NUMBER-v0.1
  scope: numbers, room and route identifiers
  allowedProcessing:
  - trim outer spaces
  - Unicode NFKC
  - fullwidth to halfwidth digits
  - approved leading-zero handling
  prohibitedProcessing:
  - arithmetic correction
  - digit substitution
- normalizationRuleId: NORM-DATE-v0.1
  scope: dates
  allowedProcessing:
  - trim outer spaces
  - Unicode NFKC
  - approved equivalence among YYYY-MM-DD, 年月日 and 月日 forms when task permits
  prohibitedProcessing:
  - swap month and day without approved locale rule
  - infer missing year when required
- normalizationRuleId: NORM-TIME-v0.1
  scope: clock times
  allowedProcessing:
  - trim outer spaces
  - Unicode NFKC
  - approved equivalence among 9:00, 09:00 and 上午九点 when semantically identical
  prohibitedProcessing:
  - ignore AM/PM meaning
  - round times
- normalizationRuleId: NORM-PHONE-v0.1
  scope: telephone numbers
  allowedProcessing:
  - trim outer spaces
  - Unicode NFKC
  - remove approved visual separators
  prohibitedProcessing:
  - reorder or substitute digits
- normalizationRuleId: NORM-SHORT-CORE-TEXT-v0.1
  scope: very short core text
  allowedProcessing:
  - trim outer spaces
  - Unicode NFC
  - ignore explicitly non-target final punctuation
  prohibitedProcessing:
  - simplified-traditional conversion
  - homophone substitution
  - grammar rewrite
  - fuzzy semantic match
- normalizationRuleId: NORM-FORM-v0.1
  scope: mixed form fields
  allowedProcessing:
  - apply each field-specific approved normalization rule
  prohibitedProcessing:
  - one global fuzzy rule for all fields
partialCreditPolicies:
- partialCreditPolicyId: PC-NONE-v0.1
  rule: One response yields full point or zero; no negative marking.
- partialCreditPolicyId: PC-PER-MATCH-v0.1
  rule: Each correct match earns its own point; an incorrect match does not remove
    another correct point.
- partialCreditPolicyId: PC-PER-FIELD-v0.1
  rule: Each valid independent field earns its defined point; invalid or blank
    fields score zero.
- partialCreditPolicyId: PC-ANALYTIC-RUBRIC-v0.1
  rule: Dimension scores are combined using the approved rubric; no hidden content
    receives credit.
invalidResponsePolicies:
- invalidResponsePolicyId: INVALID-OBJECTIVE-v0.1
  rules:
    blank: 0
    invalidId: 0
    multipleWhenSingle: 0
    technicalFailure: NotScoredTechnical
- invalidResponsePolicyId: INVALID-CONSTRUCTED-v0.1
  rules:
    blank: 0
    completelyOffTopic: 0
    noScorableLanguage: 0
    technicalFailure: NotScoredTechnical
    shortButRelevant: scoreActualEvidence
technicalIncidentPolicy:
  technicalIncidentPolicyId: TECH-INCIDENT-v0.1
  statuses:
  - NotScoredTechnical
  - ScoringHold
  - Inconclusive
  rule: A system failure must not automatically give the candidate a zero; first
    recover, allow a controlled retry, exclude the invalid item, or record
    insufficient evidence as appropriate.
adjudicationPolicies:
- adjudicationPolicyId: ADJ-NOT-APPLICABLE-v0.1
  scope: objective items without scoring dispute
- adjudicationPolicyId: ADJ-HUMAN-THIRD-RATER-v0.1
  scope: constructed responses
  triggers:
  - any dimension differs by 2 or more bands
  - validity disagreement
  - difference may change skill or certification result
  - technical or rubric gap flag
raterQualificationPolicy:
  raterQualificationPolicyId: RATER-A1-CONSTRUCTED-v0.1-provisional
  applicableRubricIds:
  - RUB-W-A1-v0.1
  - RUB-S-A1-INTERACTION-v0.1
  - RUB-S-A1-PRODUCTION-v0.1
  benchmarkSetVersion: PendingRealCandidateResponses
  qualificationThresholds: PendingPilotRatingStudy
  status: StructureReadyEvidencePending
