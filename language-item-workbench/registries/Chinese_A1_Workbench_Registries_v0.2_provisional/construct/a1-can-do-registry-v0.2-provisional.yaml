registryType: A1CanDoRegistry
registryVersion: 0.2-provisional
status: ProvisionalWorkbenchUse
entries:
- canDoId: A1-L1
  title: Understand basic personal and familiar information
  primarySkill: Listening
  activity: Reception
  observableEvidence: Identify names, residence, work or study, family relationships, preferences, or daily activities in very short, clearly delivered spoken texts.
  boundary: Input is short and clearly delivered; no implied meaning or complex reference is required.
- canDoId: A1-L2
  title: Extract explicit practical information
  primarySkill: Listening
  activity: Reception
  observableEvidence: Locate times, dates, places, quantities, prices, phone numbers, room numbers, route numbers, or simple arrangements in short dialogues, messages, announcements, or broadcasts.
  boundary: One to three explicit information points; no complex inference is required.
- canDoId: A1-L3
  title: Understand simple communicative purposes and instructions
  primarySkill: Listening
  activity: Reception
  observableEvidence: Understand greetings, thanks, apologies, questions, requests, invitations, confirmation questions, and one-step instructions.
  boundary: Assess only the direct purpose or action; selecting an appropriate response does not constitute Interaction.
- canDoId: A1-R1
  title: Understand signs, labels, and short notices
  primarySkill: Reading
  activity: Reception
  observableEvidence: Understand entrances, exits, floors, room numbers, business or class times, simple permissions and prohibitions, products, and prices.
  boundary: Text is very short and clearly structured; success does not depend on cultural knowledge.
- canDoId: A1-R2
  title: Find key information in short messages and practical texts
  primarySkill: Reading
  activity: Reception
  observableEvidence: Locate explicit facts in messages, menus, schedules, timetables, event information, forms, appointments, and work arrangements.
  boundary: Materials are short and can be reread; no interpretation of attitude, argument, or extended text is required.
- canDoId: A1-S1
  title: Provide basic personal information
  primarySkill: Speaking
  activity: Production
  observableEvidence: Use words, formulaic expressions, and simple sentences to introduce oneself or a familiar person and state residence, work, study, contact details, or schedule.
  boundary: Pauses and errors are acceptable; an extended self-introduction is not required.
- canDoId: A1-S2
  title: Express direct needs and familiar content
  primarySkill: Speaking
  activity: Production
  observableEvidence: Express likes, wants, needs, abilities, current activities, weather, food preferences, basic health problems, or simple descriptions.
  boundary: One to three simple sentences; no explanation of reasons or comparison is required.
- canDoId: A1-W1
  title: Complete a basic online form
  primarySkill: Writing
  activity: Production
  observableEvidence: Use Simplified Chinese, numbers, and date formats to enter a name, nationality, city, birthday, phone number, work or study information, and availability.
  boundary: Four to six clearly labelled fields; no real sensitive information is required.
- canDoId: A1-W2
  title: Write a very short practical message
  primarySkill: Writing
  activity: Production
  observableEvidence: Write a short message containing one to three content points to invite, confirm an arrangement, express a need, ask a question, or reply about a course, appointment, or work matter.
  boundary: The message is very short and has a clear purpose; a formal or extended email is not required.
- canDoId: A1-I1
  title: Conduct a basic personal exchange
  primarySkill: Speaking
  activity: Interaction
  observableEvidence: Answer questions about oneself and familiar daily life, and initiate one simple relevant question.
  boundary: Two to three turns; limited repetition and assistance are allowed.
- canDoId: A1-I2
  title: Complete a simple, predictable everyday exchange
  primarySkill: Speaking
  activity: Interaction
  observableEvidence: Complete a short exchange when ordering food, asking a price, buying a ticket, asking for directions, confirming a course or appointment, requesting an object, or asking for help.
  boundary: A highly familiar situation with two to three turns and no complex negotiation.
- canDoId: A1-I3a
  title: Arrange or confirm a simple plan orally
  primarySkill: Speaking
  activity: Interaction
  observableEvidence: Ask about, state, or confirm a meeting, class, work arrangement, activity, appointment, or attendance orally.
  boundary: Address only explicit arrangements such as time, place, and attendance status.
- canDoId: A1-I3b
  title: Arrange or confirm a simple plan in writing
  primarySkill: Writing
  activity: Interaction
  observableEvidence: Use a very short message to ask about, state, or confirm a course, work arrangement, activity, appointment, or attendance.
  boundary: The candidate must produce an actual reply; selecting a predefined response is not sufficient.
- canDoId: A1-I4
  title: Maintain and repair a basic exchange
  primarySkill: Speaking
  activity: Interaction
  observableEvidence: Signal a lack of understanding; ask for repetition, slower speech, or help; or confirm a word, number, time, or place.
  boundary: Use a small set of formulaic expressions; the input itself must not be deliberately ambiguous or excessively fast.
- canDoId: A1-M1
  title: Relay simple explicit information orally
  primarySkill: Speaking
  activity: Mediation
  observableEvidence: Select one to three relevant information points from a short notice, timetable, information card, or message and relay them orally to a specified recipient.
  boundary: Use one short source with explicit information; no summarising, explaining, or comparing is required.
- canDoId: A1-M2
  title: Relay simple explicit information in writing
  primarySkill: Writing
  activity: Mediation
  observableEvidence: Select a time, place, price, quantity, or arrangement from a short source and write a short message to a specified recipient.
  boundary: The response must be a recipient-oriented message; mechanical copying alone does not demonstrate mediation.
