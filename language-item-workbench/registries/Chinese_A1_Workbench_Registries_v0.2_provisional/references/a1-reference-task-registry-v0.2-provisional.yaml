- itemRuleId: legacy-rule-e4f4749bbd9657cc5cbd123ec0e4e78a53a904ed7a3fb6645b0f8785475c10d2
  valid: A two-turn exchange states “明天下午三点在图书馆门口见”; the candidate identifies the
    time and place.
  invalid: Requires inferring whether the sender is angry.
  lower: One message and one information point.
  typical: A 2–3-turn exchange with two information points.
  upper: A 3–4-turn short exchange containing a small amount of irrelevant
    information.
- itemRuleId: legacy-rule-ebf86e0da1ccfdbe2d2cb0021c9c65e462c89ff04c77bfb7be83f77d23eb79a2
