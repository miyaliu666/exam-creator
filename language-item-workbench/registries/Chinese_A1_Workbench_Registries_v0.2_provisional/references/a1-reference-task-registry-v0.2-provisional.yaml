- itemRuleId: legacy-rule-c7bdf2f8d5ea3548c61903733dcf1a3858a86df5f8d991b0f8285dee87c373d2
  valid: A timetable lists courses, times, and classrooms; the candidate locates
    the classroom for Tuesday at 9:00.
  invalid: A dense table that requires calculating the duration of breaks.
  lower: One column or a short list.
  typical: Locate one field in a clear, small table.
  upper: Connect two explicit fields in the same row.
