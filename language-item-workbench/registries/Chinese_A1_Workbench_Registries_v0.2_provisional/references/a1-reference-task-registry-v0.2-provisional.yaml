registryType: A1ReferenceTaskRegistry
registryVersion: 0.2-provisional
status: DraftBriefsNotApprovedItems
entries:
- slot: R-A1-1
  valid: 通知“星期一不开门”，考生选择星期一不能做什么；答案由文字直接确定。
  invalid: 只凭文化特定图标即可作答，且文字含未支持的表外关键词。
  lower: 一个高频标志和明显情境。
  typical: 一个短句含一个明确事实或否定。
  upper: 短通知含两个相关显性信息，干扰项较接近。
- slot: R-A1-2
  valid: 两轮消息说明“明天下午三点在图书馆门口见”，考生定位时间和地点。
  invalid: 要求推断发送者是否生气。
  lower: 单条消息和一个信息点。
  typical: 2-3 轮消息和两个信息点。
  upper: 3-4 轮短消息，含少量无关信息。
- slot: R-A1-3
  valid: 课程表列出课程、时间、教室，考生定位星期二九点的教室。
  invalid: 密集表格并要求计算课间时长。
  lower: 一列或简短列表。
  typical: 清楚小表格查一个字段。
  upper: 连接同一行两个显性字段。
- slot: R-A1-4
  valid: 三句人物资料说明姓名、工作地点和下班时间，考生选择明确信息。
  invalid: 长篇过去经历并判断态度。
  lower: 2 句、1 人、1 目标事实。
  typical: 3 句、2 个信息点。
  upper: 4 句和少量相近事实。
- slot: L-A1-1
  valid: 听“安娜在学校学汉语”，选择对应人物活动图片。
  invalid: 只用最小声调对制造陷阱。
  lower: 单句一个信息点和明显图片。
  typical: 短句加一个非目标信息。
  upper: 极短交流含两个熟悉信息。
- slot: L-A1-2
  valid: 听两轮对话确认“一杯茶二十元”，选择价格。
  invalid: 多次自我修正并以三道依赖题考记忆。
  lower: 2 轮、目标在句尾。
  typical: 2-3 轮、一个无关细节。
  upper: 3 轮、相近数字或地点但答案显性。
- slot: L-A1-3
  valid: 听课程留言，填写“星期三、九点、305教室”三个独立字段。
  invalid: 听写完整句子和大量汉字。
  lower: 一段音频一个数字字段。
  typical: 2 个按顺序出现的信息点。
  upper: 3 个信息点和少量非目标信息。
- slot: L-A1-4
  valid: 听“请在门口等一下”，选择应采取的行动。
  invalid: 把选择适当回应标成 Interaction。
  lower: 直接请求、选项差异大。
  typical: 常见确认或一步指示。
  upper: 语用相近选项，但只有一个在情境中合适。
- slot: W-A1-1
  valid: 根据资料卡或自选虚构信息填写姓名、城市、生日、电话和学习情况。
  invalid: 要求真实证件号、完整住址，且全部机械复制。
  lower: 4 字段、2 个中文字段。
  typical: 5 字段、混合中文和数字。
  upper: 6 字段并从资料卡选择少量信息。
- slot: W-A1-2
  valid: 朋友邀请明天下午见面；回复能否参加并确认地点。
  invalid: 写与源消息无关的陈述或正式长邮件。
  lower: 1 个必要内容点和强提示。
  typical: 2 个内容点，回应并确认安排。
  upper: 3 个内容点并提出一个简单问题。
- slot: W-A1-3
  valid: 从课程通知选择时间和教室，给同学写短消息。
  invalid: 逐字复制整份通知，没有指定接收者。
  lower: 一个相关信息点和明显接收者。
  typical: 两个相关信息点和少量无关信息。
  upper: 三个信息点，需加入简单行动要求。
- slot: S-A1-1
  valid: 回答住在哪里、学习什么，并主动问对方一个相关问题。
  invalid: 连续两分钟背诵自我介绍。
  lower: 两个直接问题和明确提问框架。
  typical: 2-3 轮并主动提一个相关问题。
  upper: 有限追问，提示更少但仍可预测。
- slot: S-A1-2
  valid: 根据信息卡说出身体不适和需要的帮助，回答 1-3 句。
  invalid: 讲述病史、原因和治疗计划。
  lower: 一个内容点和图片支持。
  typical: 两个内容点。
  upper: 三个内容点并连接两个简单信息。
- slot: S-A1-3
  valid: 在餐厅完成 2-3 轮点餐和数量确认，并实际提出一次请求。
  invalid: 只点击答案或由生成式 AI 临时改变问题。
  lower: 固定两轮和明显提示。
  typical: 三轮含一次请求或确认。
  upper: 有限分支或交流修复，分支已预先审核。
- slot: S-A1-4
  valid: 查看公交信息卡，把线路、时间和上车地点口头告诉朋友。
  invalid: 朗读整张信息卡或总结多条线路。
  lower: 一个相关信息点。
  typical: 两个信息点和明确对象。
  upper: 三个信息点和少量无关信息。
