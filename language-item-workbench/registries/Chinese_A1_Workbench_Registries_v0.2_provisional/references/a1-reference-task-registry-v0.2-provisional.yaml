entries:
- itemRuleId: legacy-rule-5a24db839969ad64af09b47ec5dc290b4b81d186dff05b732dc1eee72beb0e61
  valid: A notice states “星期一不开门”; the candidate selects what cannot be done on
    Monday, and the text determines the answer directly.
  invalid: The answer can be inferred from a culture-specific icon alone, while
    the text contains unsupported out-of-scope keywords.
  lower: One high-frequency sign in an obvious context.
  typical: One short sentence containing one explicit fact or negation.
  upper: A short notice containing two related explicit facts, with relatively
    close distractors.
- itemRuleId: legacy-rule-01eeec4aa91e2dceb1fc541825c8a04e89f31042c2ad7b48e8e975bb939312f4
  valid: A notice states “星期一不开门”; the candidate selects what cannot be done on
