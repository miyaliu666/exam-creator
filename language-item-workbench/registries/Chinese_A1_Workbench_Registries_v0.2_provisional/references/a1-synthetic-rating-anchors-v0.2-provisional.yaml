status: SyntheticNotForQualification
entries:
  W-A1-2:
    task: 小林：明天下午三点一起去图书馆，可以吗？回复小林，说明能不能去，并确认在哪里见。
    bands:
      3:
      - 可以。我们三点在图书馆门口见，好吗？
      - 回应邀请并确认时间和地点。
      2:
      - 可以，三点见。在哪里见？
      - 主要行为完成，但地点只以问题提出。
      1:
      - 我明天去。谢谢。
      - 相关但没有清楚确认安排。
      0:
      - 我喜欢苹果。
      - 完全离题。
  W-A1-3:
    task: 通知：汉语课星期二上午九点，305教室。给安娜写消息，告诉她上课时间和教室。
    bands:
      3:
      - 安娜，汉语课星期二上午九点，在305教室。
      - 准确选择并面向接收者转告全部信息。
      2:
      - 安娜，星期二九点上汉语课，在305。
      - 主要信息准确，形式略简略。
      1:
      - 安娜，星期二上课。
      - 只转告一个不完整信息点。
      0:
      - 我不知道。
      - 没有转告有效信息。
  S-A1-1:
    task: 回答：你住在哪里？你学习什么？然后问对方一个相关问题。
    bands:
      3:
      - 我住在西雅图。我学习汉语。你呢？你住在哪里？
      - 回答问题并主动提问。
      2:
      - 我住西雅图，学汉语。你学习什么？
      - 主要行为完成，有小问题但可理解。
      1:
      - 西雅图。汉语。
      - 少量相关信息，没有主动提问。
      0:
      - （无回答）
      - 没有可评分语言。
  S-A1-2:
    task: 你在餐厅。说出你想喝什么和数量。
    bands:
      3:
      - 我想要两杯茶，谢谢。
      - 完成饮料和数量。
      2:
      - 我要茶，两杯。
      - 信息完整且可理解。
      1:
      - 茶。
      - 只提供一个内容点。
      0:
      - 我在学校。
      - 离题。
  S-A1-3:
    task: 系统：您好，您要喝什么？考生回答。系统：一杯还是两杯？考生确认数量并提出一个简单请求。
    bands:
      3:
      - 我要茶。两杯。请给我两杯茶，谢谢。
      - 完成多轮回应和请求。
      2:
      - 茶。两杯，可以吗？
      - 完成回应和确认，语言有限。
      1:
      - 茶。
      - 只完成第一轮。
      0:
      - （只有无法理解的声音）
      - 没有可理解互动证据。
  S-A1-4:
    task: 信息卡：12路公交车，下午四点出发，学校门口上车。告诉朋友线路、时间和上车地点。
    bands:
      3:
      - 我们坐十二路车，下午四点出发，在学校门口上车。
      - 准确转告三个信息点。
      2:
      - 十二路车，四点，在学校门口上车。
      - 信息基本完整。
      1:
      - 四点坐车。
      - 只有一个不完整信息点。
      0:
      - 我喜欢坐车。
      - 没有转告关键信息。
