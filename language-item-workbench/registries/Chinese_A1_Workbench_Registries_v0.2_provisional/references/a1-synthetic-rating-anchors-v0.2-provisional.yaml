registryType: A1SyntheticRatingAnchors
registryVersion: 0.2-provisional
status: SyntheticNotForQualification
entries:
  W-A1-2:
    task: 小林：明天下午三点一起去图书馆，可以吗？回复小林，说明能不能去，并确认在哪里见。
    bands:
      3:
      - 可以。我们三点在图书馆门口见，好吗？
      - Responds to the invitation and confirms the time and place.
      2:
      - 可以，三点见。在哪里见？
      - Completes the main communicative action, but only asks about the place.
      1:
      - 我明天去。谢谢。
      - Relevant, but does not confirm the arrangement clearly.
      0:
      - 我喜欢苹果。
      - Completely off topic.
  W-A1-3:
    task: 通知：汉语课星期二上午九点，305教室。给安娜写消息，告诉她上课时间和教室。
    bands:
      3:
      - 安娜，汉语课星期二上午九点，在305教室。
      - Selects all information accurately and relays it to the recipient.
      2:
      - 安娜，星期二九点上汉语课，在305。
      - The main information is accurate, though the form is slightly abbreviated.
      1:
      - 安娜，星期二上课。
      - Relays only one incomplete information point.
      0:
      - 我不知道。
      - Relays no valid information.
  S-A1-1:
    task: 回答：你住在哪里？你学习什么？然后问对方一个相关问题。
    bands:
      3:
      - 我住在西雅图。我学习汉语。你呢？你住在哪里？
      - Answers the questions and initiates a question.
      2:
      - 我住西雅图，学汉语。你学习什么？
      - Completes the main communicative action with minor but intelligible issues.
      1:
      - 西雅图。汉语。
      - Provides limited relevant information without initiating a question.
      0:
      - （无回答）
      - Contains no scorable language.
  S-A1-2:
    task: 你在餐厅。说出你想喝什么和数量。
    bands:
      3:
      - 我想要两杯茶，谢谢。
      - Provides both the drink and quantity.
      2:
      - 我要茶，两杯。
      - The information is complete and intelligible.
      1:
      - 茶。
      - Provides only one content point.
      0:
      - 我在学校。
      - Off topic.
  S-A1-3:
    task: 系统：您好，您要喝什么？考生回答。系统：一杯还是两杯？考生确认数量并提出一个简单请求。
    bands:
      3:
      - 我要茶。两杯。请给我两杯茶，谢谢。
      - Completes the multi-turn responses and request.
      2:
      - 茶。两杯，可以吗？
      - Completes the response and confirmation with limited language.
      1:
      - 茶。
      - Completes only the first turn.
      0:
      - （只有无法理解的声音）
      - Provides no intelligible evidence of interaction.
  S-A1-4:
    task: 信息卡：12路公交车，下午四点出发，学校门口上车。告诉朋友线路、时间和上车地点。
    bands:
      3:
      - 我们坐十二路车，下午四点出发，在学校门口上车。
      - Relays all three information points accurately.
      2:
      - 十二路车，四点，在学校门口上车。
      - The information is substantially complete.
      1:
      - 四点坐车。
      - Provides only one incomplete information point.
      0:
      - 我喜欢坐车。
      - Relays no key information.
