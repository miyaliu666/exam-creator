name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Test frontend workflow logic and item templates
        run: bun test ./tests

      - name: Install trusted review validator dependencies
        working-directory: language-item-workbench/review-repository
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test review repository validation
        working-directory: language-item-workbench/review-repository
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Rust
        run: cargo clippy --locked --no-default-features --all-targets

      - name: Test Rust
        run: cargo test --locked --no-default-features --all-targets

  package:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build application image without publishing
        run: docker build --tag exam-creator:${{ github.sha }} .
