name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let a dev Pages deployment finish before the next dev run can publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma generate

      - name: Build frontend
        run: bun run build

      - name: Test frontend workflow logic and item templates
        run: bun test ./tests

      - name: Install trusted review validator dependencies
        working-directory: language-item-workbench/review-repository
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test review repository validation
        working-directory: language-item-workbench/review-repository
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Rust
        run: cargo clippy --locked --no-default-features --all-targets

      - name: Test Rust
        run: cargo test --locked --no-default-features --all-targets

  package:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build application image without publishing
        run: docker build --tag exam-creator:${{ github.sha }} .

  pages-build:
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.current.outputs.publish }}
    steps:
      - name: Skip commits superseded on dev
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/dev',
            });
            const publish = data.object.sha === context.sha;
            core.setOutput('publish', String(publish));
            if (!publish) core.notice('Skipping Pages build: dev has a newer commit.');

      - uses: actions/checkout@v4
        if: steps.current.outputs.publish == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        if: steps.current.outputs.publish == 'true'
        with:
          bun-version: '1.3.11'

      - uses: actions/setup-node@v4
        if: steps.current.outputs.publish == 'true'
        with:
          node-version: '22'

      - name: Validate public build configuration
        if: steps.current.outputs.publish == 'true'
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const configured = process.env.VITE_API_BASE_URL?.trim();
          if (!configured) throw new Error('Set the repository variable VITE_API_BASE_URL to the public HTTPS backend origin.');
          let api;
          try { api = new URL(configured); }
          catch { throw new Error('VITE_API_BASE_URL must be a valid HTTPS origin.'); }
          if (api.protocol !== 'https:' || api.username || api.password || api.pathname !== '/' || api.search || api.hash) {
            throw new Error('VITE_API_BASE_URL must be an HTTPS origin without credentials, path, query, or fragment.');
          }
          const repository = process.env.GITHUB_REPOSITORY?.split('/');
          if (repository?.length !== 2 || !/^[A-Za-z0-9_.-]+$/.test(repository[1])) {
            throw new Error('Invalid repository name for the Pages base path.');
          }
          const [owner, name] = repository;
          const base = name.toLowerCase() === `${owner.toLowerCase()}.github.io` ? '/' : `/${name}/`;
          appendFileSync(process.env.GITHUB_ENV, `VITE_BASE_PATH=${base}\nVITE_API_BASE_URL=${api.origin}\nVITE_MOCK_DATA=false\n`);
          NODE

      - name: Build the checked commit for GitHub Pages
        if: steps.current.outputs.publish == 'true'
        run: |
          bun install --frozen-lockfile
          bun run prisma generate
          bun run build
          test -s dist/index.html
          test -s dist/404.html

      - name: Upload the static site
        if: steps.current.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages-deploy:
    if: needs.pages-build.outputs.publish == 'true'
    needs: pages-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck dev before publishing
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/dev',
            });
            const publish = data.object.sha === context.sha;
            core.setOutput('publish', String(publish));
            if (!publish) core.notice('Skipping Pages deployment: dev has a newer commit.');

      - name: Read Pages configuration
        if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Deploy to GitHub Pages
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
